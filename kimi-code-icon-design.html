<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kimi Code 图标设计稿</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 40px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  h1 {
    color: #e0e0e0;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 30px;
    max-width: 900px;
  }
  .icon-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .icon-label {
    color: #888;
    font-size: 12px;
    letter-spacing: 1px;
  }

  /* 基础圆形 - Kimi 风格 */
  .icon-base {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  /* 深色太空背景 */
  .bg-space {
    background: linear-gradient(180deg, #1a1a2e 0%, #0d0d1a 60%, #0a0a15 100%);
  }

  /* 月球表面纹理 */
  .moon-texture {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 45%;
    background:
      radial-gradient(ellipse 30% 20% at 20% 70%, rgba(80,80,90,0.4) 0%, transparent 70%),
      radial-gradient(ellipse 25% 15% at 50% 80%, rgba(70,70,80,0.35) 0%, transparent 70%),
      radial-gradient(ellipse 20% 25% at 75% 65%, rgba(60,60,70,0.3) 0%, transparent 70%),
      radial-gradient(ellipse 15% 10% at 35% 85%, rgba(90,90,100,0.25) 0%, transparent 70%);
  }

  /* 月球陨石坑 - 小圆点 */
  .crater {
    position: absolute;
    border-radius: 50%;
    background: rgba(40,40,50,0.5);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
  }

  /* 符号容器 */
  .symbol {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    color: #f0f0f5;
    font-weight: 300;
    line-height: 1;
    z-index: 10;
    text-shadow: 0 0 20px rgba(255,255,255,0.15);
  }

  /* ===== 版本一：</> ===== */
  .v1 .symbol {
    font-size: 44px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    letter-spacing: -2px;
  }

  /* ===== 版本二：{} ===== */
  .v2 .symbol {
    font-size: 52px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }

  /* ===== 版本三：K + </> 融合 ===== */
  .v3 .symbol {
    font-size: 56px;
    font-weight: 500;
    font-family: -apple-system, sans-serif;
  }
  .v3 .code-tag {
    font-size: 18px;
    font-family: 'SF Mono', monospace;
    color: #6b8dd6;
    position: absolute;
    right: 28%;
    top: 35%;
  }

  /* ===== 版本四：终端提示符 $_> ===== */
  .v4 .symbol {
    font-size: 36px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    letter-spacing: 1px;
  }
  .v4 .cursor {
    display: inline-block;
    width: 2px;
    height: 24px;
    background: #6b8dd6;
    margin-left: 2px;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== 版本五：01 二进制 ===== */
  .v5 .symbol {
    font-size: 40px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    letter-spacing: 4px;
    color: #c0c0d0;
  }

  /* ===== 版本六：# (井号/Sharp) ===== */
  .v6 .symbol {
    font-size: 54px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-weight: 400;
  }

  /* ===== 版本七：</> + 轨道环 ===== */
  .v7 .orbit-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 70px;
    height: 70px;
    border: 1.5px solid rgba(107,141,214,0.3);
    border-radius: 50%;
    transform: translate(-50%, -55%) rotate(-15deg);
  }
  .v7 .symbol {
    font-size: 32px;
    font-family: 'SF Mono', monospace;
  }

  /* ===== 版本八：极简 [] ===== */
  .v8 .symbol {
    font-size: 50px;
    font-family: 'SF Mono', monospace;
    letter-spacing: -4px;
    color: #d0d0e0;
  }

  /* 底部说明 */
  .footer {
    color: #555;
    font-size: 11px;
    margin-top: 20px;
    text-align: center;
    line-height: 1.8;
  }

  @media (max-width: 768px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<h1>Kimi Code 图标设计稿</h1>

<div class="grid">

  <!-- 版本一：</> -->
  <div class="icon-card">
    <div class="icon-base bg-space v1">
      <div class="moon-texture"></div>
      <div class="crater" style="width:8px;height:6px;bottom:22%;left:18%;"></div>
      <div class="crater" style="width:5px;height:4px;bottom:30%;left:45%;"></div>
      <div class="crater" style="width:6px;height:5px;bottom:18%;right:25%;"></div>
      <div class="symbol">&lt;/&gt;</div>
    </div>
    <div class="icon-label">版本一 · 代码标签</div>
  </div>

  <!-- 版本二：{} -->
  <div class="icon-card">
    <div class="icon-base bg-space v2">
      <div class="moon-texture"></div>
      <div class="crater" style="width:7px;height:5px;bottom:25%;left:22%;"></div>
      <div class="crater" style="width:4px;height:3px;bottom:32%;left:50%;"></div>
      <div class="crater" style="width:5px;height:4px;bottom:20%;right:28%;"></div>
      <div class="symbol">{}</div>
    </div>
    <div class="icon-label">版本二 · 花括号</div>
  </div>

  <!-- 版本三：K + </> -->
  <div class="icon-card">
    <div class="icon-base bg-space v3">
      <div class="moon-texture"></div>
      <div class="crater" style="width:6px;height:5px;bottom:24%;left:20%;"></div>
      <div class="crater" style="width:4px;height:4px;bottom:28%;left:48%;"></div>
      <div class="crater" style="width:5px;height:4px;bottom:19%;right:26%;"></div>
      <div class="symbol">K<span class="code-tag">&lt;/&gt;</span></div>
    </div>
    <div class="icon-label">版本三 · K融合代码</div>
  </div>

  <!-- 版本四：$_> -->
  <div class="icon-card">
    <div class="icon-base bg-space v4">
      <div class="moon-texture"></div>
      <div class="crater" style="width:8px;height:6px;bottom:23%;left:19%;"></div>
      <div class="crater" style="width:5px;height:4px;bottom:31%;left:47%;"></div>
      <div class="crater" style="width:6px;height:5px;bottom:21%;right:24%;"></div>
      <div class="symbol">$_&gt;<span class="cursor"></span></div>
    </div>
    <div class="icon-label">版本四 · 终端提示符</div>
  </div>

  <!-- 版本五：01 -->
  <div class="icon-card">
    <div class="icon-base bg-space v5">
      <div class="moon-texture"></div>
      <div class="crater" style="width:7px;height:5px;bottom:26%;left:21%;"></div>
      <div class="crater" style="width:4px;height:3px;bottom:30%;left:49%;"></div>
      <div class="crater" style="width:5px;height:4px;bottom:18%;right:27%;"></div>
      <div class="symbol">01</div>
    </div>
    <div class="icon-label">版本五 · 二进制</div>
  </div>

  <!-- 版本六：# -->
  <div class="icon-card">
    <div class="icon-base bg-space v6">
      <div class="moon-texture"></div>
      <div class="crater" style="width:6px;height:5px;bottom:24%;left:23%;"></div>
      <div class="crater" style="width:5px;height:4px;bottom:33%;left:46%;"></div>
      <div class="crater" style="width:4px;height:3px;bottom:20%;right:29%;"></div>
      <div class="symbol">#</div>
    </div>
    <div class="icon-label">版本六 · 井号</div>
  </div>

  <!-- 版本七：轨道 </> -->
  <div class="icon-card">
    <div class="icon-base bg-space v7">
      <div class="moon-texture"></div>
      <div class="crater" style="width:5px;height:4px;bottom:25%;left:25%;"></div>
      <div class="crater" style="width:6px;height:5px;bottom:29%;left:52%;"></div>
      <div class="crater" style="width:4px;height:3px;bottom:19%;right:30%;"></div>
      <div class="orbit-ring"></div>
      <div class="symbol">&lt;/&gt;</div>
    </div>
    <div class="icon-label">版本七 · 轨道代码</div>
  </div>

  <!-- 版本八：[] -->
  <div class="icon-card">
    <div class="icon-base bg-space v8">
      <div class="moon-texture"></div>
      <div class="crater" style="width:7px;height:5px;bottom:22%;left:20%;"></div>
      <div class="crater" style="width:5px;height:4px;bottom:30%;left:48%;"></div>
      <div class="crater" style="width:6px;height:5px;bottom:21%;right:26%;"></div>
      <div class="symbol">[]</div>
    </div>
    <div class="icon-label">版本八 · 方括号</div>
  </div>

</div>

<div class="footer">
  仿照 Kimi App 图标风格设计 · 保留月球表面陨石坑纹理<br>
  主符号替换为代码相关元素 · 深色太空渐变背景
</div>

</body>
</html>
